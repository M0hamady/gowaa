name: Jowwa assistant regression
on:
  pull_request:
    branches:
      - main
    paths:
      - 'public/assistant.js'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/welcome.css'
      - 'src/server-assistant.mjs'
      - 'tests/assistant.test.mjs'
      - 'tests/neighborhood-service-additions.test.mjs'
      - '.github/workflows/assistant-regression.yml'
permissions:
  contents: read
jobs:
  assistant-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check assistant and app syntax
        run: |
          node --check public/app.js
          node --check public/assistant.js
          node --check src/server-assistant.mjs
          node --check api/assistant.mjs
      - name: Regenerate public directory pages
        run: npm run pretest
      - name: Test assistant actions and simplified home
        run: node --test tests/assistant*.test.mjs tests/home-assistant-entry.test.mjs
      - name: Build production assets
        run: npm run build
        env:
