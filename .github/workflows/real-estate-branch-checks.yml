name: Real estate isolated branch checks
on:
  push:
    branches:
      - feat/real-estate-portfolio-map-test
  pull_request:
    branches:
      - feat/operations-test-workspace
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
